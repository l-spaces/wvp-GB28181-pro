services:
  mysql:
    image: mysql:8.4.9
    container_name: wvp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Wvp@2026!mysql"
      MYSQL_DATABASE: "wvp2"
      MYSQL_USER: "wvp"
      MYSQL_PASSWORD: "Wvp@2026!mysql"
      TZ: "Asia/Shanghai"
    ports:
      - "13306:3306"
    volumes:
      # 数据挂载
      - ./mysql/data/:/var/lib/mysql/
      # 配置挂载
      - ./mysql/conf/:/etc/mysql/conf.d/
      # 首次启动建表脚本（相对 compose 目录，随 script 目录一起上传）
      - ./sql/初始化-mysql-2.7.4.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    privileged: true
    networks:
      - wvp-network

  redis:
    image: redis:8.6.3
    container_name: wvp-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - ./redis/conf:/redis/config:rw
      # 数据文件
      - ./redis/data/:/redis/data/:rw
    command: "redis-server /redis/config/redis.conf"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 'cy*889900' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    privileged: true
    networks:
      - wvp-network

  zlmediakit:
    image: zlmediakit/zlmediakit:master_py
    container_name: zlmediakit
    restart: unless-stopped
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - "18978:18978/tcp"                      # HTTP-FLV / HLS / API
      # - "8443:8443/tcp"
      # - "554:554/tcp"                      # RTSP，可选
      # - "1935:1935/tcp"                    # RTMP，可选
      - "10000:10000/udp"                  # RTP 单端口收流
      - "10000:10000/tcp"                  # RTP TCP，可选
      # - "30000-30100:30000-30100/udp"      # RTP 多端口收流
      # - "30000-30100:30000-30100/tcp"      # RTP 多端口收流
      - "8970:8970/udp"                    # WebRTC媒体端口(STUN/DTLS/SRTP)
      - "8970:8970/tcp"                    # WebRTC媒体端口(UDP不通时TCP回退)
      # - "19000:9000/udp"
    volumes:
      - ./zlm/config.ini:/opt/media/conf/config.ini:ro
      - ./zlm/logs:/opt/media/bin/log
      - ./zlm/record:/opt/media/bin/www/record
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    networks:
      - wvp-network
  wvp:
    build:
      context: ./jar
      dockerfile: Dockerfile
    container_name: wvp-main
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      zlmediakit:
        condition: service_started

    environment:
      TZ: "Asia/Shanghai"

      # 必须选择 Docker 配置。
      # 源码中的 application.yml 默认启用的是 274-dev。
      SPRING_PROFILES_ACTIVE: "docker"

      # MySQL：容器之间使用服务名和容器端口
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/wvp2?useUnicode=true&characterEncoding=UTF8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai&useSSL=false&allowMultiQueries=true&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "wvp"
      SPRING_DATASOURCE_PASSWORD: "Wvp@2026!mysql"

      # Redis
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_DB: "6"
      REDIS_PWD: "cy*889900"

      # SIP/GB28181
      WVP_HOST: "0.0.0.0"
      # 前端接入信息展示的IP
      WVP_SHOW_IP: "192.168.1.100"
      WVP_PORT: "8160"
      WVP_DOMAIN: "5132210000"
      WVP_ID: "51322100002000000001"
      WVP_PWD: "cy*889900"

      # ZLMediaKit 容器内部地址
      ZLM_HOST: "zlmediakit"
      ZLM_PORT: "18978"

      # 必须与 config.ini 完全一致
      MEDIA_ID: "zlm-01"
      MEDIA_SECRET: "3a9a5eb37502d57e8cf9f7031faca6b486caa21093a364b5b89fcc19ed2490d9"

      # ZLM 回调 WVP 时使用 Docker 服务名
      MEDIA_HOOK_IP: "wvp"

      # 外部摄像机向这个公网IP发送RTP
      MEDIA_SDP_IP: "192.168.1.100"

      # 平台返回的播放地址IP
      MEDIA_STREAM_IP: "192.168.1.100"

      MEDIA_RTP_ENABLE: "false"
      MEDIA_RTP_PORT_RANGE: "30000,30100"
      MEDIA_RTP_SEND_PORT_RANGE: "30000,30100"

    ports:
      # 调试阶段允许外部访问。
      # 正式部署后建议使用防火墙、VPN或Nginx限制管理页面。
      - "18080:18080/tcp"

      # GB28181 SIP
      # SIP服务器端口
      - "8160:8160/tcp"
      - "8160:8160/udp"

    volumes:
      # 业务文件挂载（覆盖镜像内COPY，改配置/换jar只需restart，无需重新build）
      - ./jar/wvp.jar:/opt/wvp/wvp.jar
      - ./jar/application.yml:/opt/wvp/application.yml
      - ./jar/application-docker.yml:/opt/wvp/application-docker.yml
      # JWT 密钥持久化（jwkFile 见 application-docker.yml），避免重启后 token 失效
      - wvp-config:/opt/wvp/config
      # 运行日志
      - ./jar/logs:/opt/wvp/logs

    networks:
      - wvp-network

networks:
  wvp-network:
    name: wvp-network
    driver: bridge

volumes:
  wvp-config:
